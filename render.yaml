services:
  - type: web
    name: 619-erp-backend
    runtime: node
    # Free plan spins down after ~15 min idle (30-60s cold start on the next
    # request) and has no zero-downtime deploy guarantee. Fine for
    # development; upgrade to a paid plan before any real/commercial launch.
    plan: free
    # India-facing app (Razorpay/INR billing, +91 support numbers) — closest
    # Render region to cut latency.
    region: singapore
    repo: https://github.com/abhishek21lift-oss/619-erp-backend
    branch: main
    buildCommand: npm install
    startCommand: node src/server.js
    # Lets Render's deploy process verify the new instance is actually
    # serving before routing traffic to it / marking the deploy healthy.
    healthCheckPath: /api/health
    envVars:
      # Node 20.18 cannot `require()` an ES module. otplib's CommonJS build
      # requires @scure/base, which is ESM-only, so on 20.18 loading
      # routes/auth.js throws ERR_REQUIRE_ESM and the service never boots.
      # require(esm) landed in 20.19; 22 is the current LTS and Node 20 is now
      # end-of-life, so the pin moves forward rather than to 20.19.
      - key: NODE_VERSION
        value: 22.11.0
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: FRONTEND_URL
        sync: false
      # RP_ID / WEBAUTHN_ORIGIN / CORS_ORIGIN must match the actual domain(s)
      # this instance serves. Previously hardcoded to the original vendor's
      # own domain, which would silently break passkeys and block the
      # frontend on every other deployment of this repo (e.g. a new client).
      # Set these per-deployment in the Render dashboard instead.
      - key: RP_ID
        sync: false
      - key: WEBAUTHN_ORIGIN
        sync: false
      - key: CORS_ORIGIN
        sync: false
      # ── Email ────────────────────────────────────────────────────────────
      # Without these three, lib/email.js isConfigured() is false and every
      # outgoing message is skipped: admin invitations, password-reset links,
      # and the Control Centre's "email them a link" button. The public
      # forgot-password endpoint still answers "a reset link has been sent",
      # because it must not reveal whether an address is registered — so a
      # missing value here is invisible from the outside. Declared (rather
      # than omitted) so the requirement is part of the deployment contract
      # instead of folklore.
      #
      # Values are per-deployment, not secrets-only: SMTP_HOST and SMTP_USER
      # depend on whichever mailbox this instance sends from, so guessing them
      # here would produce a service that boots fine and silently fails to
      # send. Set all of them in the Render dashboard.
      #
      # Verify before trusting it — `npm run verify:smtp you@example.com`
      # sends a real message using exactly these variables.
      - key: SMTP_HOST
        sync: false
      # 465 selects implicit TLS, anything else STARTTLS (lib/email.js:
      # `secure: SMTP_PORT === 465`). Unset means 587. It is listed here
      # because the right value is a property of SMTP_HOST, not a default.
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      # The From address. Must be one the mailbox above is allowed to send as,
      # or the provider rejects the message outright.
      - key: SMTP_FROM
        sync: false
      # From address for invitations specifically — the one message a
      # recipient is asked to trust, so it goes from something replyable
      # rather than a noreply. Falls back to SMTP_FROM when unset.
      - key: EMAIL_FROM
        sync: false
