# infra/nginx/command-center.conf — the platform control plane's vhost
#
# SEPARATE FROM myptstudio.conf ON PURPOSE. Do not merge it back in.
#
# This block references a TLS certificate for admin.myptstudio.com. `nginx -t`
# fails on a certificate file that is not there, and a failed test means
# `systemctl restart nginx` leaves nginx down — which takes myptstudio.com and
# api.myptstudio.com down with it. myptstudio.conf is meant to be copied to the
# box as-is; a file that cannot start until an out-of-band step has happened
# does not belong inside it.
#
# So this is opt-in by filename. Copy it only after step 2 below.
#
# ── Deploying, in this order ────────────────────────────────────────────────
#
# 1. Point admin.myptstudio.com at the same host (A/AAAA record). The :80
#    redirect block in myptstudio.conf already answers for this name, which is
#    what lets certbot's HTTP-01 challenge reach it.
#
# 2. Issue the certificate:
#        sudo certbot certonly --webroot -w /var/www/certbot \
#             -d admin.myptstudio.com
#    Confirm /etc/letsencrypt/live/admin.myptstudio.com/fullchain.pem exists
#    before going further. Everything below fails without it.
#
# 3. Install this file and TEST BEFORE RELOADING:
#        sudo cp command-center.conf /etc/nginx/sites-available/
#        sudo ln -s /etc/nginx/sites-available/command-center.conf \
#                   /etc/nginx/sites-enabled/
#        sudo nginx -t && sudo systemctl reload nginx
#    `reload` rather than `restart`: a reload keeps the running config if the
#    new one is bad, a restart does not.
#
# 4. Set BOTH of these on the FRONTEND container and restart it:
#        COMMAND_CENTER_HOST=admin.myptstudio.com
#        NEXT_PUBLIC_APP_ORIGIN=https://myptstudio.com
#    Until COMMAND_CENTER_HOST is set the app applies no host rule at all, so
#    this vhost serves the entire studio app on the operator's domain and
#    nothing is isolated. The DNS, the certificate and the variables have to
#    land together or the split is cosmetic.
#
# ── What this buys over the in-app rule alone ───────────────────────────────
#
# The edge proxy (frontend src/proxy.ts) already 404s console pages on the
# studio host and vice versa. That is a rule, and rules have bugs. A separate
# hostname makes it a fact about the URL: /platform is not a path a tenant can
# find, it is a site whose address they do not have.
#
# It also gives the console its own certificate and access log, and leaves room
# for the thing the app cannot do from inside itself — an IP allow-list or mTLS
# in front of the whole console, which is a couple of lines here.

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name admin.myptstudio.com;

    ssl_certificate     /etc/letsencrypt/live/admin.myptstudio.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.myptstudio.com/privkey.pem;

    # Smaller than the studio app's 25m on purpose. The console uploads studio
    # logos and nothing else; it has no progress photos, no PAR-Q documents and
    # no face-recognition models, so the limit that the studio app needs is
    # just extra surface here.
    client_max_body_size 5m;

    # Security headers come from the frontend's src/lib/security-headers.js,
    # same as the studio vhost. Setting them here would be a second source of
    # truth for one of them and a silent divergence for the rest.

    location / {
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/snippets/myptstudio-proxy.conf;

        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}

