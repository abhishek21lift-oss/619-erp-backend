name: Rollback Backend

# Put a known-good commit back on the box, without waiting for a revert to
# travel through main and CI.
#
# Before this existed there was no rollback path at all: no image tags, no
# registry, no previous-version reference anywhere. Undoing a bad deploy meant
# reverting the commit, pushing, and sitting through the same full rebuild as a
# forward deploy — the slowest possible response to the moment you most need a
# fast one.
#
# This deploys a specific SHA directly. It is deliberately manual and
# deliberately unguarded by CI: you reach for it when main is broken, so
# requiring main's pipeline to be green first would defeat the point.
#
# Like deploy.yml, this now runs ON the VPS via the self-hosted runner rather
# than reaching in over SSH. That matters more here than there: a rollback is
# what you run during an incident, and the SSH path was unavailable for ten
# minutes at a stretch on at least two occasions. An incident tool that might
# not connect is not an incident tool.
#
# ── What this does NOT do ───────────────────────────────────────────────────
#
# It does not roll the DATABASE back. Migrations are forward-only here, and
# there is no down-migration tooling. If the deploy you are undoing applied a
# migration, rolling the code back leaves the newer schema in place. That is
# usually fine — the additive migrations this repo writes (ADD COLUMN IF NOT
# EXISTS, CREATE INDEX, ENABLE RLS) are readable by the older code — but a
# migration that dropped or renamed something is NOT recoverable this way and
# needs a hand-written forward fix instead. The confirmation input below exists
# so nobody discovers that mid-incident.

on:
  workflow_dispatch:
    inputs:
      sha:
        description: 'Full or short git SHA to roll back to (must exist on origin/main)'
        required: true
        type: string
      confirm:
        description: 'Type ROLLBACK to confirm. Read the schema note in this file first.'
        required: true
        type: string

jobs:
  rollback:
    runs-on: [self-hosted, myptstudio]
    timeout-minutes: 30

    steps:
      - name: Refuse unless explicitly confirmed
        if: inputs.confirm != 'ROLLBACK'
        run: |
          echo "::error::Confirmation not given. Type ROLLBACK in the confirm field."
          exit 1

      - name: Roll the box back to the requested commit
        # The SHA travels as an environment variable rather than being
        # interpolated into the script text. `${{ inputs.sha }}` inside a run
        # block is substituted BEFORE bash sees it, so a crafted input would be
        # pasted in as shell source; "$SHA" is just a string to bash however it
        # is spelled. Same value, no injection seam.
        env:
          SHA: ${{ inputs.sha }}
        run: |
          set -euo pipefail
          cd /opt/myptstudio/619-erp-backend

          echo "Currently deployed: $(cat /opt/myptstudio/.backend-deployed-sha 2>/dev/null || echo unknown)"
          echo "Rolling back to:    $SHA"

          git fetch origin main

          # Fail before touching anything if the SHA is not real. A typo here
          # would otherwise leave the checkout in a detached, arbitrary state.
          git cat-file -e "$SHA^{commit}" || {
            echo "No such commit: $SHA"
            exit 1
          }

          git checkout --detach "$SHA"

          cd /opt/myptstudio
          docker compose build backend
          docker compose up -d backend

          git -C /opt/myptstudio/619-erp-backend rev-parse HEAD \
            > /opt/myptstudio/.backend-deployed-sha

          echo "Rolled back. The checkout is now DETACHED at $SHA."
          echo "The next normal deploy runs 'git checkout main' before pulling,"
          echo "so it will move off this commit by itself once main carries the"
          echo "fix — nothing needs doing on the box by hand."
          echo
          echo "NOTE: the database was NOT rolled back. See the header of this"
          echo "file if the release you just undid applied a migration."
