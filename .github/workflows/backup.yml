name: Nightly database backup

# ── Why this workflow exists ────────────────────────────────────────────────
#
# docs/DISASTER-RECOVERY.md establishes the finding: the Supabase organisation
# is on the FREE plan, which gets no automated backups and no PITR, so six live
# studios' data had exactly one copy. scripts/backup-database.js was written as
# the stopgap — and then nothing scheduled it. A backup script that no clock
# ever invokes is documentation, not a restore point.
#
# ── Why it runs over SSH rather than on the runner ──────────────────────────
#
# The doc offers three homes: a VPS cron entry, a systemd timer, or a scheduled
# Action. This is the third, shaped like the first — it SSHes to the same box
# deploy.yml already deploys to and runs the script there.
#
# That choice is deliberate. A GitHub-hosted runner would need DATABASE_URL as
# a brand-new repository secret, putting a second copy of the production
# credential somewhere it is not needed; the VPS already has it, in the env the
# API container reads. It also keeps the dump on a host that can reach the
# database directly and that already holds the R2 credentials for the off-site
# upload. No new secret is introduced: HOST, USERNAME and SSH_KEY are the same
# three deploy.yml uses.
#
# ── What this does NOT fix ──────────────────────────────────────────────────
#
# A nightly logical dump is an RPO of up to 24 hours. PITR measured in minutes
# needs the Pro plan, and that decision is still open — see the disaster
# recovery doc. This narrows the exposure; it does not close it. And a backup
# nobody has restored is not yet a proven restore path: the doc's restore
# rehearsal is still owed.

on:
  schedule:
    # 02:30 UTC daily. Off the hour because every scheduled workflow on GitHub
    # fires at :00 and the queue there is long enough to skip runs.
    - cron: '30 2 * * *'
  workflow_dispatch:

concurrency:
  group: database-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Run pg_dump on the VPS and upload off-site
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          timeout: 60s
          command_timeout: 30m
          # Fail the step on the first failing command. A backup job that
          # reports green while pg_dump errored is the exact failure mode the
          # script's own verification exists to prevent.
          script_stop: true
          script: |
            set -euo pipefail
            cd /opt/myptstudio

            # Box-level knobs (BACKUP_DIR, BACKUP_UPLOAD, BACKUP_RETAIN_DAYS,
            # BACKUP_DATABASE_URL, BACKUP_R2_BUCKET) may live in .env.
            if [ -f .env ]; then set -a; . ./.env; set +a; fi

            # ── The credentials come from the running API container ──────
            #
            # Every run from #1 to #13 failed. The first ones died at
            # "node: command not found"; once that was fixed (the backup
            # image below), every run died at "None of BACKUP_DATABASE_URL,
            # ADMIN_DATABASE_URL or DATABASE_URL is set": the API does not
            # get its connection string from /opt/myptstudio/.env, so
            # sourcing that file handed the backup nothing.
            #
            # Rather than guess where Compose resolves it from, read what the
            # live backend container was actually started with. That is, by
            # definition, a connection string that works right now, and it
            # cannot drift from the app's: rotate the password and the next
            # backup uses the new one. Only the variables the backup needs
            # are copied, into a 0600 file that is deleted on exit; secrets
            # never appear in argv or in the log.
            BACKEND_CID="$(docker compose ps -q backend)"
            if [ -z "$BACKEND_CID" ]; then
              echo "backup failed: the backend container is not running, so there is no connection string to use."
              exit 1
            fi
            ENV_FILE="$(mktemp)"
            chmod 600 "$ENV_FILE"
            trap 'rm -f "$ENV_FILE"' EXIT
            docker inspect --format '{{range .Config.Env}}{{println .}}{{end}}' "$BACKEND_CID" \
              | grep -E '^(DATABASE_URL|ADMIN_DATABASE_URL|R2_ACCOUNT_ID|R2_ACCESS_KEY_ID|R2_SECRET_ACCESS_KEY)=.' \
              > "$ENV_FILE" || true
            # Explicit backup-only overrides from .env win (docker takes the
            # last occurrence of a name).
            for v in BACKUP_DATABASE_URL BACKUP_R2_BUCKET; do
              if [ -n "${!v:-}" ]; then printf '%s=%s\n' "$v" "${!v}" >> "$ENV_FILE"; fi
            done
            if ! grep -qE '^(DATABASE_URL|ADMIN_DATABASE_URL|BACKUP_DATABASE_URL)=' "$ENV_FILE"; then
              echo "backup failed: the backend container has no DATABASE_URL either."
              exit 1
            fi

            # Off-site upload needs the R2 keys. Without them the dump is
            # still taken and verified on this box — a real restore point —
            # and the run says plainly that it is not off-site, instead of
            # failing and hiding that a good local dump exists.
            UPLOAD="${BACKUP_UPLOAD:-1}"
            if [ "$UPLOAD" != "0" ] && ! grep -q '^R2_SECRET_ACCESS_KEY=' "$ENV_FILE"; then
              echo "::warning::R2 credentials are not set on the backend — this backup stays on the VPS only (not off-site)."
              UPLOAD=""
            fi
            if [ "$UPLOAD" = "0" ]; then UPLOAD=""; fi

            # In a container, not on the host: the host has no node and no
            # pg_dump. infra/backup/Dockerfile carries both, with pg_dump
            # matching the server's major version.
            #
            # BACKUP_DIR must sit outside the repository — the script refuses
            # otherwise, because a dump inside a working tree is one `git add`
            # away from being published.
            BACKUP_HOST_DIR="${BACKUP_DIR:-/var/backups/619}"
            install -d -m 700 "$BACKUP_HOST_DIR"
            docker build --quiet -t myptstudio-backup -f 619-erp-backend/infra/backup/Dockerfile 619-erp-backend
            docker run --rm \
              --env-file "$ENV_FILE" \
              -e BACKUP_DIR=/backups \
              -e BACKUP_UPLOAD="$UPLOAD" \
              -e BACKUP_RETAIN_DAYS="${BACKUP_RETAIN_DAYS:-30}" \
              -v "$BACKUP_HOST_DIR:/backups" \
              myptstudio-backup

      - name: Say so loudly if the backup did not run
        if: failure()
        run: |
          echo "::error::Nightly database backup FAILED."
          echo "::error::This project has no other restore point — see docs/DISASTER-RECOVERY.md."
          exit 1
