name: CI — Lint · Test · Audit

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main]
  # Manual re-run.
  #
  # GitHub does not trigger `push` workflows for pushes authenticated with an
  # app or bot token — it is a recursion guard. So a commit landed that way
  # gets no CI run at all, and since deploy.yml now waits on CI's conclusion,
  # that means no deploy either: the commit is on main and nothing happens.
  # This button is how such a commit gets a result without an empty commit
  # pushed by hand.
  workflow_dispatch:

# Cancel in-progress runs on the same branch to save CI minutes
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Job 1: Lint ────────────────────────────────────────────────────
  lint:
    name: ESLint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        # The backlog is cleared, so the ceiling is zero: any new warning fails
        # CI immediately rather than being absorbed into a budget.
        run: npm run lint -- --max-warnings=0

  # ── Job 2: Unit tests ──────────────────────────────────────────────
  test:
    name: Jest
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      JWT_SECRET: ci-test-secret-not-real
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_619
      # The one suite that proves tenant isolation against a REAL database
      # rather than against SQL text. It self-skips when this is unset, and it
      # was unset here — so from the day it was written until now it had never
      # actually run in CI. Its own database, separate from test_619, stood up
      # by the step below.
      RLS_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/rls_proof?sslmode=disable
      # psql and node-postgres both read this; the service below is not on
      # trust auth.
      PGPASSWORD: postgres

    services:
      postgres:
        # pgvector, not plain postgres:15 — migration 046 adds vector(128) and
        # 116 adds vector(384), so `CREATE EXTENSION vector` has to succeed or
        # the migrations cannot be applied at all. This image is postgres:15
        # plus that extension, so nothing else about the job changes.
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_619
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Creates the rls_proof database on the service above: extensions, the
      # Supabase-compatible roles, schema.sql, every migration, and the
      # app_tenant role that 157 defines. The script is the same one the
      # isolation suite's own header tells a developer to run locally, so CI
      # and a laptop stand the database up exactly the same way.
      - name: Stand up the RLS isolation database
        run: ./scripts/rls-proof-setup.sh
        env:
          RLS_PG_HOST: localhost
          RLS_PG_PORT: 5432

      - name: Run tests
        run: npm test -- --passWithNoTests

  # ── Job 3: Security audit ──────────────────────────────────────────
  security:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Audit dependencies
        # Clean as of the brace-expansion override in package.json. When a new
        # advisory lands, prefer `overrides` for a transitive dependency over
        # loosening this threshold.
        run: npm audit --audit-level=high
