name: Deploy Backend to VPS

# Runs only after CI has PASSED on main — and on demand.
on:
  workflow_run:
    workflows: ["CI — Lint · Test · Audit"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-vps-backend
  cancel-in-progress: false

env:
  # ── One command per line, deliberately ─────────────────────────────────
  #
  # Everything this script does must be expressible as a single line. The
  # verification step used to be a multi-line `for` loop here, and it never
  # ran: the deploy log showed the container start and the script exit 1
  # 41ms later, with none of the loop's output — not its error branch, not
  # the 150 seconds of polling it should have taken. The identical block run
  # as an ordinary script polls correctly, so the block was fine and the way
  # these lines get assembled and shipped over SSH is what could not carry
  # it. Every line that preceded it, through 200-odd successful deploys, had
  # been exactly one command.
  #
  # So multi-line logic lives in scripts/deploy/, which is one line to call,
  # has ordinary shell semantics, and has tests. The echoed markers below are
  # here so that the next time this stops early, the log says where.
  DEPLOY_SCRIPT: |
    set -e
    cd /opt/myptstudio/619-erp-backend
    git fetch origin main
    git checkout main
    git pull --ff-only origin main
    git rev-parse HEAD > /opt/myptstudio/.backend-deployed-sha.new
    export GIT_SHA="$(git rev-parse HEAD)"
    export BUILD_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
    echo "deploy: building $GIT_SHA"
    cd /opt/myptstudio
    # This box's compose file is maintained outside the repo and defines only
    # `backend` (no `worker` service), so build/up must name just that.
    docker compose build --build-arg GIT_SHA="$GIT_SHA" --build-arg BUILD_TIME="$BUILD_TIME" backend
    echo "deploy: built; running migrations"
    docker compose run --rm --no-deps backend npm run migrate
    echo "deploy: migrated; replacing container"
    docker compose rm -sf backend
    docker compose up -d backend
    echo "deploy: container started; verifying it serves $GIT_SHA"
    bash /opt/myptstudio/619-erp-backend/scripts/deploy/verify-serving.sh "$GIT_SHA" /opt/myptstudio backend http://127.0.0.1:5000/api/health /opt/myptstudio/.backend-deployed-sha
    # Read-only topology probe: says whether a separate worker container exists
    # and whether this API process starts workers in-process.
    docker ps --format 'deploy: running {{.Names}} {{.Image}} {{.Status}}'
    docker compose exec -T backend sh -c 'echo "deploy: RUN_WORKERS=${RUN_WORKERS:-unset}"' || true

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Report what is being deployed and why it was allowed
        run: |
          echo "Trigger:    ${{ github.event_name }}"
          echo "CI result:  ${{ github.event.workflow_run.conclusion || 'n/a (manual dispatch)' }}"
          echo "Commit:     ${{ github.event.workflow_run.head_sha || github.sha }}"

      # ── Why there are three attempts, and why the waits poll ────────────
      #
      # The runner intermittently cannot reach the VPS at all:
      #
      #   2026/08/05 06:14:53 dial tcp ***:22: i/o timeout
      #
      # On 31 Oct 2026 the frontend's copy of this workflow lost the box on
      # 22, 80 AND 443 for ~25 minutes while the box served HTTPS to everyone
      # else — so this is the runner's egress, not an SSH filter.
      #
      # The old ladder waited 90s, 5min and 15min with `sleep`. Those waits are
      # blind: they run to the end even after the box answers, so a 6-minute
      # outage still cost 22 minutes, and the deploy started whenever the last
      # sleep expired rather than when SSH came back. These steps poll 22 every
      # 10s and return the moment it opens, so the retry starts within ~10s of
      # recovery and the worst case (20 min of waiting) is unchanged.
      #
      # `continue-on-error` keeps each failure from ending the job; the last
      # attempt has none, so it decides the outcome — and the diagnostic step
      # below fires when the whole ladder fails, saying WHAT was unreachable.
      - name: Deploy to VPS via SSH
        id: attempt
        continue-on-error: true
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          # A healthy handshake completes in well under a second; 60s only
          # made each failed attempt a full minute of dead time.
          timeout: 20s
          command_timeout: 20m
          script_stop: true
          script: ${{ env.DEPLOY_SCRIPT }}

      # Polls instead of sleeping: exits as soon as 22 answers, or after the
      # budget so the next attempt reports the real error. Never fails the job.
      - name: Wait for the box to answer again (up to 10 min)
        if: steps.attempt.outcome == 'failure'
        run: |
          for i in $(seq 1 60); do
            timeout 5 bash -c "cat < /dev/null > /dev/tcp/${{ secrets.HOST }}/22" 2>/dev/null && exit 0
            sleep 10
          done

      - name: Deploy to VPS via SSH (retry 1)
        id: retry1
        continue-on-error: true
        if: steps.attempt.outcome == 'failure'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          timeout: 20s
          command_timeout: 20m
          script_stop: true
          script: ${{ env.DEPLOY_SCRIPT }}

      - name: Wait longer (up to 10 min)
        if: steps.attempt.outcome == 'failure' && steps.retry1.outcome == 'failure'
        run: |
          for i in $(seq 1 60); do
            timeout 5 bash -c "cat < /dev/null > /dev/tcp/${{ secrets.HOST }}/22" 2>/dev/null && exit 0
            sleep 10
          done

      # The last attempt has no continue-on-error: it decides the job.
      - name: Deploy to VPS via SSH (retry 2)
        if: steps.attempt.outcome == 'failure' && steps.retry1.outcome == 'failure'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          timeout: 20s
          command_timeout: 20m
          script_stop: true
          script: ${{ env.DEPLOY_SCRIPT }}

      - name: Diagnose what the VPS is answering on
        if: failure()
        continue-on-error: true
        run: |
          for port in 22 80 443; do
            if timeout 10 bash -c "cat < /dev/null > /dev/tcp/${{ secrets.HOST }}/$port" 2>/dev/null; then
              echo "port $port: OPEN"
            else
              echo "port $port: no answer within 10s"
            fi
          done
          echo "If 443 is open and 22 is not, the box is up and SSH is being filtered."
          echo "If none are open, the box or its network is down."
