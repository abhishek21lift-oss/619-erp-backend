name: Deploy Backend to VPS

# Runs only after CI has PASSED on main — and on demand.
#
# It used to trigger on `push: main` directly. So did ci.yml, which meant the
# two raced: a commit that failed lint, tests or `npm audit` still deployed,
# because nothing connected the pipelines. The test suite was advisory.
#
# `workflow_run` is the fix. It fires when the named workflow COMPLETES, and
# the job-level `if` below requires a successful conclusion, so a red CI run
# ends the pipeline instead of shipping.
#
# `workflow_dispatch` stays: a deploy that can only be triggered by a commit is
# a deploy you cannot repeat. When an infrastructure blip fails the run, main
# stays undeployed until somebody happens to push again; the "Run workflow"
# button redeploys whatever main currently is. A manual dispatch deliberately
# skips the gate — it is the break-glass path, and the operator pressing it can
# see CI's state for themselves.
on:
  workflow_run:
    workflows: ["CI — Lint · Test · Audit"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# ── Why this job runs ON the VPS ─────────────────────────────────────────────
#
# It used to run on a GitHub-hosted runner and reach in over SSH. That meant
# every deploy depended on a stranger's machine completing a TCP handshake to
# port 22 on this box, and repeatedly it could not:
#
#   2026/08/05 06:14:53 dial tcp ***:22: i/o timeout
#   05 Aug  outage swallowed 07:17 and 07:20, over by 07:27          (~10 min)
#   08 Aug  swallowed 06:43, 06:46 AND 06:52 — every attempt — on a
#           box that had deployed successfully at 06:05              (>10 min)
#
# The response had been to add retries: four attempts spanning twenty-two
# minutes, about a hundred lines of ladder. That hid the problem rather than
# removing it, and the 08 Aug outage outlasted the ladder anyway.
#
# A self-hosted runner inverts the direction. The runner sits on this box and
# asks GitHub for work over outbound HTTPS on 443 — a long poll it re-opens
# itself. Nothing has to reach in, no inbound port is involved, and the entire
# class of failure above cannot occur because no SSH connection is ever made.
# The retry ladder, the SSH secrets and the port diagnostics all went with it.
#
# What this costs: the runner is a process on the production box, so it must be
# kept updated, and anyone who can push a workflow to this repo can run code on
# the box. That is why this repo should stay private and why branch protection
# on main matters more now than it did.
#
# Setup (once, on the VPS — see the deploy README):
#   GitHub → repo Settings → Actions → Runners → New self-hosted runner
#   Label it `myptstudio`. The runner user needs docker group membership and
#   write access to /opt/myptstudio.

concurrency:
  # One deploy at a time. Two runs racing on the same working tree is a
  # `git checkout` fighting a `docker compose build` over the same files.
  # cancel-in-progress stays false: killing a half-finished deploy is worse
  # than queueing behind it.
  group: deploy-backend
  cancel-in-progress: false

jobs:
  deploy:
    # `self-hosted` alone would match any runner on the account. The second
    # label pins this to the box that actually holds /opt/myptstudio.
    runs-on: [self-hosted, myptstudio]

    # A cold `docker compose build` plus migrations is minutes, not seconds.
    # This replaces the SSH action's command_timeout.
    timeout-minutes: 30

    # The gate. On workflow_run this requires CI to have concluded 'success';
    # a manual dispatch bypasses it deliberately (see the header).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Report what is being deployed and why it was allowed
        run: |
          echo "Trigger:    ${{ github.event_name }}"
          echo "CI result:  ${{ github.event.workflow_run.conclusion || 'n/a (manual dispatch)' }}"
          echo "Commit:     ${{ github.event.workflow_run.head_sha || github.sha }}"

      # Deliberately no actions/checkout. The deploy operates on the long-lived
      # clone at /opt/myptstudio/619-erp-backend, which is what docker compose
      # builds from; checking the repo out into the runner's own work directory
      # would produce a second copy that nothing serves.
      - name: Deploy
        run: |
          set -euo pipefail

          cd /opt/myptstudio/619-erp-backend

          # `checkout main` before pulling, because rollback.yml leaves the
          # checkout DETACHED at the rolled-back commit. A bare
          # `git pull origin main` against a detached HEAD does not move it, so
          # the next deploy after a rollback would report success and ship
          # nothing. --ff-only fails loudly rather than creating a merge commit
          # or quietly discarding anything edited on the box.
          git fetch origin main
          git checkout main
          git pull --ff-only origin main

          # Record what is about to serve, so rollback.yml has a target that
          # does not require reading the deploy log.
          git rev-parse HEAD > /opt/myptstudio/.backend-deployed-sha.new

          cd /opt/myptstudio

          docker compose build backend

          # Apply migrations BEFORE the new container serves traffic.
          #
          # This step did not exist. `npm run migrate` was a manual, out-of-band
          # action, which is how the live schema drifted from the tracked
          # migrations in at least 16 documented places — and it meant a deploy
          # could ship code expecting a column the database did not have yet.
          #
          # `run --rm --no-deps` uses the freshly built image and its env (so
          # DATABASE_URL comes from the same place the app reads it) without
          # starting or restarting the serving container. Under `set -e` a
          # failed migration aborts the deploy and leaves the OLD container
          # running — the correct failure mode, since a half-migrated database
          # serving new code is worse than a delayed release.
          docker compose run --rm --no-deps backend npm run migrate

          docker compose up -d backend

          # Only now is the new SHA actually serving.
          mv /opt/myptstudio/.backend-deployed-sha.new /opt/myptstudio/.backend-deployed-sha

          docker image prune -f

      # The old workflow probed ports 22/80/443 from the runner to work out
      # what was unreachable. Running on the box itself, that question is
      # answered better by what the box says about its own containers.
      - name: Show what the stack looks like if the deploy failed
        if: failure()
        continue-on-error: true
        run: |
          cd /opt/myptstudio
          docker compose ps || true
          echo "── last 50 lines of backend ──"
          docker compose logs --tail=50 backend || true
