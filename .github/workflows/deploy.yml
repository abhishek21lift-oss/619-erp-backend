name: Deploy Backend to VPS

# Runs only after CI has PASSED on main — and on demand.
on:
  workflow_run:
    workflows: ["CI — Lint · Test · Audit"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-vps-backend
  cancel-in-progress: false

env:
  DEPLOY_SCRIPT: |
    set -e
    cd /opt/myptstudio/619-erp-backend
    git fetch origin main
    git checkout main
    git pull --ff-only origin main
    git rev-parse HEAD > /opt/myptstudio/.backend-deployed-sha.new
    # Exported so docker-compose's build args pick them up. The sha was
    # already being written to a file here and then not used for anything the
    # running container could see — this is what makes /api/health and every
    # log line able to name the build they came from.
    export GIT_SHA="$(git rev-parse HEAD)"
    export BUILD_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
    cd /opt/myptstudio
    # --build-arg explicitly, rather than relying on the compose file's `args`.
    # The compose file at /opt/myptstudio/docker-compose.yml is NOT this
    # repository's — that one defines `api` and `worker`, this script builds a
    # service called `backend` — so it lives outside version control and
    # nothing here can add build args to it. Passing them on the command line
    # works whichever compose file is really there, and the repo's own compose
    # declares the same args so a local build behaves identically.
    docker compose build \
      --build-arg GIT_SHA="$GIT_SHA" \
      --build-arg BUILD_TIME="$BUILD_TIME" \
      backend
    docker compose run --rm --no-deps backend npm run migrate
    docker compose rm -sf backend
    docker compose up -d backend

    # ── Deployment verification ────────────────────────────────────────────
    #
    # `docker compose up -d` returning 0 means a container was STARTED, not
    # that it is serving, and certainly not that it is serving the commit we
    # just built. A build that silently reused a cached layer, an image that
    # crash-loops after the healthcheck's start period, a compose file pointing
    # somewhere else — all of them leave this script "successful" with the old
    # build still answering, which is exactly the state that makes "is the fix
    # deployed?" unanswerable.
    #
    # So the box asks the running container which commit it is, and refuses to
    # record a successful deploy unless the answer matches. The API is bound to
    # 127.0.0.1, which is why this runs here and not from the runner.
    SERVING=""
    for _ in $(seq 1 30); do
      SERVING="$(curl -sf --max-time 5 http://127.0.0.1:5000/api/health 2>/dev/null         | grep -o '"sha":"[0-9a-f]*"' | head -1 | cut -d'"' -f4 || true)"
      [ "$SERVING" = "$GIT_SHA" ] && break
      sleep 5
    done

    if [ "$SERVING" != "$GIT_SHA" ]; then
      echo "::error::deploy verification failed — expected $GIT_SHA, container reports '${SERVING:-no answer}'"
      docker compose logs --tail 60 backend || true
      # The marker file is NOT advanced. It keeps naming the last commit known
      # to have actually served traffic, which is what a rollback needs.
      rm -f /opt/myptstudio/.backend-deployed-sha.new
      exit 1
    fi
    echo "deploy verified: backend is serving $SERVING"

    mv /opt/myptstudio/.backend-deployed-sha.new /opt/myptstudio/.backend-deployed-sha
    docker image prune -f

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Report what is being deployed and why it was allowed
        run: |
          echo "Trigger:    ${{ github.event_name }}"
          echo "CI result:  ${{ github.event.workflow_run.conclusion || 'n/a (manual dispatch)' }}"
          echo "Commit:     ${{ github.event.workflow_run.head_sha || github.sha }}"

      - name: Deploy to VPS via SSH
        id: attempt
        continue-on-error: true
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          timeout: 60s
          command_timeout: 20m
          script_stop: true
          script: ${{ env.DEPLOY_SCRIPT }}

      - name: Wait for the box to answer again
        if: steps.attempt.outcome == 'failure'
        run: sleep 90

      - name: Deploy to VPS via SSH (retry 1)
        id: retry1
        continue-on-error: true
        if: steps.attempt.outcome == 'failure'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          timeout: 60s
          command_timeout: 20m
          script_stop: true
          script: ${{ env.DEPLOY_SCRIPT }}

      - name: Wait longer
        if: steps.attempt.outcome == 'failure' && steps.retry1.outcome == 'failure'
        run: sleep 300

      - name: Deploy to VPS via SSH (retry 2)
        id: retry2
        continue-on-error: true
        if: steps.attempt.outcome == 'failure' && steps.retry1.outcome == 'failure'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          timeout: 60s
          command_timeout: 20m
          script_stop: true
          script: ${{ env.DEPLOY_SCRIPT }}

      - name: Wait out a longer outage
        if: >-
          steps.attempt.outcome == 'failure' && steps.retry1.outcome == 'failure'
          && steps.retry2.outcome == 'failure'
        run: sleep 900

      - name: Deploy to VPS via SSH (retry 3)
        if: >-
          steps.attempt.outcome == 'failure' && steps.retry1.outcome == 'failure'
          && steps.retry2.outcome == 'failure'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          timeout: 60s
          command_timeout: 20m
          script_stop: true
          script: ${{ env.DEPLOY_SCRIPT }}

      - name: Diagnose what the VPS is answering on
        if: failure()
        continue-on-error: true
        run: |
          for port in 22 80 443; do
            if timeout 10 bash -c "cat < /dev/null > /dev/tcp/${{ secrets.HOST }}/$port" 2>/dev/null; then
              echo "port $port: OPEN"
            else
              echo "port $port: no answer within 10s"
            fi
          done
          echo "If 443 is open and 22 is not, the box is up and SSH is being filtered."
          echo "If none are open, the box or its network is down."
