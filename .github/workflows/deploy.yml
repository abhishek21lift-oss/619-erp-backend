name: Deploy Backend to VPS

# Runs only after CI has PASSED on main — and on demand.
on:
  workflow_run:
    workflows: ["CI — Lint · Test · Audit"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-vps-backend
  cancel-in-progress: false

env:
  DEPLOY_SCRIPT: |
    set -e
    cd /opt/myptstudio/619-erp-backend
    git fetch origin main
    git checkout main
    git pull --ff-only origin main
    git rev-parse HEAD > /opt/myptstudio/.backend-deployed-sha.new
    cd /opt/myptstudio
    docker compose build backend
    docker compose run --rm --no-deps backend npm run migrate
    docker compose rm -sf backend
    docker compose up -d backend
    mv /opt/myptstudio/.backend-deployed-sha.new /opt/myptstudio/.backend-deployed-sha
    docker image prune -f

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Report what is being deployed and why it was allowed
        run: |
          echo "Trigger:    ${{ github.event_name }}"
          echo "CI result:  ${{ github.event.workflow_run.conclusion || 'n/a (manual dispatch)' }}"
          echo "Commit:     ${{ github.event.workflow_run.head_sha || github.sha }}"

      - name: Deploy to VPS via SSH
        id: attempt
        continue-on-error: true
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          timeout: 60s
          command_timeout: 20m
          script_stop: true
          script: ${{ env.DEPLOY_SCRIPT }}

      - name: Wait for the box to answer again
        if: steps.attempt.outcome == 'failure'
        run: sleep 90

      - name: Deploy to VPS via SSH (retry 1)
        id: retry1
        continue-on-error: true
        if: steps.attempt.outcome == 'failure'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          timeout: 60s
          command_timeout: 20m
          script_stop: true
          script: ${{ env.DEPLOY_SCRIPT }}

      - name: Wait longer
        if: steps.attempt.outcome == 'failure' && steps.retry1.outcome == 'failure'
        run: sleep 300

      - name: Deploy to VPS via SSH (retry 2)
        id: retry2
        continue-on-error: true
        if: steps.attempt.outcome == 'failure' && steps.retry1.outcome == 'failure'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          timeout: 60s
          command_timeout: 20m
          script_stop: true
          script: ${{ env.DEPLOY_SCRIPT }}

      - name: Wait out a longer outage
        if: >-
          steps.attempt.outcome == 'failure' && steps.retry1.outcome == 'failure'
          && steps.retry2.outcome == 'failure'
        run: sleep 900

      - name: Deploy to VPS via SSH (retry 3)
        if: >-
          steps.attempt.outcome == 'failure' && steps.retry1.outcome == 'failure'
          && steps.retry2.outcome == 'failure'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          timeout: 60s
          command_timeout: 20m
          script_stop: true
          script: ${{ env.DEPLOY_SCRIPT }}

      - name: Diagnose what the VPS is answering on
        if: failure()
        continue-on-error: true
        run: |
          for port in 22 80 443; do
            if timeout 10 bash -c "cat < /dev/null > /dev/tcp/${{ secrets.HOST }}/$port" 2>/dev/null; then
              echo "port $port: OPEN"
            else
              echo "port $port: no answer within 10s"
            fi
          done
          echo "If 443 is open and 22 is not, the box is up and SSH is being filtered."
          echo "If none are open, the box or its network is down."
