# Production topology for the Hostinger VPS: Redis, backend API, queue workers.
#
# ── Why this file exists ────────────────────────────────────────────────────
#
# BullMQ landed in #38 with everything it needs in the application — queues,
# the workers, health checks, graceful shutdown, and a fallback to inline
# sends when Redis is absent. The only topology file this repo ever had described
# a hosting platform the app does not run on.
# Nothing described it for the VPS, which is where the app actually runs.
#
# Without a `redis` service, REDIS_URL stays unset on the box and every queue
# silently degrades to the pre-queue inline path. That is a safe state — it is
# the reason #38 could ship — but it means none of the queue work does
# anything in production. This file is the missing half.
#
# ── Read this before deploying ──────────────────────────────────────────────
#
# The compose file that actually runs lives on the VPS at /opt/myptstudio/,
# beside the checkout, and the deploy workflows run `docker compose` there.
# Committing this here does NOT change that file. Reconcile it by hand, or copy
# this over it after checking the volume and network names match what is
# already there.
#
# ── Secrets ─────────────────────────────────────────────────────────────────
#
# Nothing here carries a value. Every variable is read from the environment or
# the .env file sitting beside this on the box. The `${VAR}` form with no
# default means compose fails loudly on a missing one rather than starting the
# API with a blank database URL; `${VAR:-}` marks the genuinely optional ones.

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Loopback only. The queue is internal, nginx does not proxy to it, and a
    # Redis reachable from the internet is how a box ends up mining somebody
    # else's cryptocurrency.
    ports:
      - '127.0.0.1:6379:6379'
    command:
      # appendonly so a restart does not lose queued jobs. A queue that empties
      # on reboot is not a queue.
      - redis-server
      - --appendonly
      - 'yes'
      - --maxmemory
      - ${REDIS_MAXMEMORY:-256mb}
      # noeviction, NOT allkeys-lru. Under memory pressure an LRU policy would
      # evict job hashes — silently deleting queued work. BullMQ would far
      # rather be told the write failed.
      - --maxmemory-policy
      - noeviction
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  backend:
    # A fixed name, because the socket-proxy allow-list and CC_API_CONTAINER
    # both name this container; a compose-generated `<project>-backend-1` would
    # change with the project directory.
    container_name: ${CC_API_CONTAINER:-erp-api}
    build:
      context: .
      # Baked into the image, not read at runtime: a production image has no
      # .git directory. The deploy script resolves these and exports them; a
      # plain `docker compose build` leaves them empty and the release reports
      # sha "unknown", which is the honest answer for a local image.
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
        BUILD_TIME: ${BUILD_TIME:-}
    restart: unless-stopped
    ports:
      - '127.0.0.1:5000:5000'
    environment:
      NODE_ENV: production
      PORT: '5000'
      # `redis` is the service name; inside the compose network it resolves to
      # the container. This is also lib/redis.js's DEFAULT_HOST, so the two
      # agree by construction rather than by coincidence.
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      # 0 because the `worker` service below drains the queues. Both draining
      # would mean two processes competing for every job — which BullMQ
      # handles correctly, but doubles the load for no throughput on a box
      # this size. Set to 1 and drop the worker service to run single-process.
      RUN_WORKERS: '0'
      DATABASE_URL: ${DATABASE_URL}
      # Both optional. ADMIN_DATABASE_URL is blank by default. TENANT_RLS_ENFORCE
      # is passed as "on" to match the app default (src/lib/tenantRlsFlag.js);
      # an empty string is NOT the same as unset at the production boot guard.
      # ADMIN_DATABASE_URL defaults to DATABASE_URL when unset.
      #
      # It has to be declared here regardless, because Compose does not
      # forward arbitrary host/`.env` variables into a container — only the
      # ones an `environment:` line names. Before this line, setting
      # ADMIN_DATABASE_URL in the box's .env would have done nothing: the
      # value would sit on the host, never reach the backend/worker processes,
      # and server.js's boot guard (isProd && enforcement on && the two URLs
      # equal) would keep refusing to start with the same error a missing
      # ADMIN_DATABASE_URL produces — indistinguishable from never having set
      # it at all.
      ADMIN_DATABASE_URL: ${ADMIN_DATABASE_URL:-}
      TENANT_RLS_ENFORCE: ${TENANT_RLS_ENFORCE:-on}
      # Both default to on inside the app; forwarded so an explicit box value
      # wins. Production rejects anything but 'on'/'off' (TENANT_RLS_ENFORCE
      # also accepts 'strict'), and rejects PLATFORM_SESSION_ENFORCE=off
      # outright. Written as "on" rather than blank because an empty value is
      # rejected by the boot guard.
      SUPER_ADMIN_REQUIRE_MFA: ${SUPER_ADMIN_REQUIRE_MFA:-on}
      PLATFORM_SESSION_ENFORCE: ${PLATFORM_SESSION_ENFORCE:-on}
      JWT_SECRET: ${JWT_SECRET}
      FRONTEND_URL: ${FRONTEND_URL}
      # Number of proxies in front of Express. Unset collapses req.ip to the
      # frontend container, turning the per-IP login limiter into one
      # platform-wide bucket. The VPS path is nginx -> Next -> API, so 2.
      TRUST_PROXY: ${TRUST_PROXY:-}
      APP_TIMEZONE: ${APP_TIMEZONE:-}
      # QR check-in signatures. Unset falls back to JWT_SECRET; naming it here
      # is what lets the box rotate it independently.
      KIOSK_HMAC_SECRET: ${KIOSK_HMAC_SECRET:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      # Uploads and AI knowledge ingestion read/write object storage from the
      # API process too; without these, uploads fall back to the local path.
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      # Push is off unless PUSH_ENABLED is exactly 'true'. The Firebase
      # credentials must reach the process for turning it on to be possible.
      PUSH_ENABLED: ${PUSH_ENABLED:-}
      FIREBASE_SERVICE_ACCOUNT: ${FIREBASE_SERVICE_ACCOUNT:-}
      FIREBASE_SERVICE_ACCOUNT_PATH: ${FIREBASE_SERVICE_ACCOUNT_PATH:-}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
      # The API serves payment verification, UPI orders and the WhatsApp
      # transport, so it needs the same provider credentials as the worker.
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_WHATSAPP_FROM: ${TWILIO_WHATSAPP_FROM:-}
      TWILIO_SMS_FROM: ${TWILIO_SMS_FROM:-}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      # Without this the webhook route cannot verify a signature and (by
      # design) refuses every delivery, so a paying studio never activates.
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
      # Google sign-in and passkey login are optional, but a value set in the
      # box's .env must reach the process or the feature reports NOT_CONFIGURED.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      RP_ID: ${RP_ID:-}
      WEBAUTHN_ORIGIN: ${WEBAUTHN_ORIGIN:-}
      CORS_ORIGIN: ${CORS_ORIGIN:-}
      # Connection tuning. DATABASE_SSL_CA is a path inside the container, so
      # it is only useful when the box also mounts the CA file.
      DATABASE_POOL_SIZE: ${DATABASE_POOL_SIZE:-}
      DATABASE_SSL_CA: ${DATABASE_SSL_CA:-}
      LOG_CAPTURE: ${LOG_CAPTURE:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
      # Rungs 4-5 of the Command Center recovery ladder. Blank = off (the
      # console shows the rungs disabled with the reason). See the
      # docker-socket-proxy service below for what turning them on means.
      DOCKER_PROXY_URL: ${DOCKER_PROXY_URL:-}
      CC_API_CONTAINER: ${CC_API_CONTAINER:-erp-api}
      CC_WORKER_CONTAINER: ${CC_WORKER_CONTAINER:-erp-worker}
      # ── AI surface (round-2 remediation) ──────────────────────────────────
      # Compose forwards ONLY the variables named here — an entry in the box's
      # .env that is not listed below never reaches the backend process (this was
      # round-1 P1: every AI var was missing, so deployed boxes reported AND
      # behaved as NOT_CONFIGURED). Blank defaults change nothing until the .env
      # sets them; the backend boot guard still fails loudly when a required var
      # (JWT/JWT-level secrets, DB) is missing.
      AI_API_KEY: ${AI_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_PRIMARY_MODEL: ${AI_PRIMARY_MODEL:-}
      AI_SECONDARY_MODEL: ${AI_SECONDARY_MODEL:-}
      AI_FALLBACK_MODEL: ${AI_FALLBACK_MODEL:-}
      AI_OPENROUTER_TIMEOUT_MS: ${AI_OPENROUTER_TIMEOUT_MS:-}
      AI_ALLOW_DATA_COLLECTION: ${AI_ALLOW_DATA_COLLECTION:-}
      # on a non-OpenRouter gateway, where to still send usage/include fields:
      # auto (default, host-gated), always, never. See lib/ai/openrouter.js.
      AI_USAGE_FIELDS_MODE: ${AI_USAGE_FIELDS_MODE:-}
      AI_USD_TO_INR: ${AI_USD_TO_INR:-}
      AI_RATE_LIMIT_PER_MINUTE: ${AI_RATE_LIMIT_PER_MINUTE:-}
      AI_QUOTA_FAILURE_ALERT_AFTER: ${AI_QUOTA_FAILURE_ALERT_AFTER:-}
      # Limiting-stack failure bias (round-1 P1 #2): blank keeps the historical
      # fail-open behaviour; "fail-closed" makes an unverifiable limiter or
      # quota check refuse the AI call instead of allowing it.
      AI_QUOTA_FAILURE_MODE: ${AI_QUOTA_FAILURE_MODE:-}
      AI_LIMITER_FAILURE_MODE: ${AI_LIMITER_FAILURE_MODE:-}
      AI_CHAT_HISTORY_LIMIT: ${AI_CHAT_HISTORY_LIMIT:-}
      AI_EMBEDDING_CACHE_DIR: ${AI_EMBEDDING_CACHE_DIR:-}
      AI_EMBEDDING_MODEL: ${AI_EMBEDDING_MODEL:-}
      AI_EMBEDDING_PROVIDER: ${AI_EMBEDDING_PROVIDER:-}
      AI_EMBEDDING_TIMEOUT_MS: ${AI_EMBEDDING_TIMEOUT_MS:-}
      AI_EMBEDDING_LOAD_TIMEOUT_MS: ${AI_EMBEDDING_LOAD_TIMEOUT_MS:-}
      AI_RAG_CHUNK_SIZE: ${AI_RAG_CHUNK_SIZE:-}
      AI_RAG_CHUNK_OVERLAP: ${AI_RAG_CHUNK_OVERLAP:-}
      AI_RAG_TOP_K: ${AI_RAG_TOP_K:-}
      AI_RAG_SIMILARITY_THRESHOLD: ${AI_RAG_SIMILARITY_THRESHOLD:-}
      AI_SETTINGS_REFRESH_MS: ${AI_SETTINGS_REFRESH_MS:-}
      # ── WhatsApp gateway ──────────────────────────────────────────────────
      # Compose forwards ONLY the variables named here. Without these the backend
      # answers 503 GATEWAY_NOT_CONFIGURED; blank defaults keep the integration
      # optional so a box with no gateway still starts.
      WA_GATEWAY_URL: ${WA_GATEWAY_URL:-}
      WA_GATEWAY_KEY: ${WA_GATEWAY_KEY:-}
      WA_WEBHOOK_SECRET: ${WA_WEBHOOK_SECRET:-}
      WA_GATEWAY_TIMEOUT_MS: ${WA_GATEWAY_TIMEOUT_MS:-10000}
    depends_on:
      redis:
        condition: service_healthy

  # The queue workers, as their own service.
  #
  # Separate from the API because embedding a PDF pins a core for tens of
  # seconds, and doing that inside the process serving requests degrades every
  # studio at once. RUN_WORKERS=1 on the backend service is the single-container
  # alternative if this box cannot spare a second one.
  worker:
    container_name: ${CC_WORKER_CONTAINER:-erp-worker}
    build:
      context: .
      # The worker needs its own identity for the same reason the backend does: it
      # is a separate container that can be running a different build after a
      # partial deploy, and its log lines are the ones nobody can attribute.
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
        BUILD_TIME: ${BUILD_TIME:-}
    restart: unless-stopped
    command: ['node', 'src/workers/index.js']
    # The image's HEALTHCHECK curls /api/health, and this container runs no
    # HTTP server — it would sit permanently unhealthy and make `docker
    # compose ps` useless for spotting a real problem. Liveness here is the
    # process being up, which restart:unless-stopped already covers.
    healthcheck:
      disable: true
    environment:
      NODE_ENV: production
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      # Explicit, though src/workers/index.js is the worker entrypoint and does
      # not read this: it documents that THIS is the process that drains.
      RUN_WORKERS: '1'
      DATABASE_URL: ${DATABASE_URL}
      # See the identical pair on the backend service above for why these two
      # lines have to be here even though both are blank by default. The
      # worker needs ADMIN_DATABASE_URL at least as much as the backend process:
      # every job here (renewal sweep, subscription expiry, notification
      # fan-out) runs with no per-request org context at all, so once
      # DATABASE_URL points at app_tenant, a worker still using it would
      # match no tenant's RLS policy and silently process nothing — see
      # db/pool.js's isPlatformWide()/useOwnerConnection().
      ADMIN_DATABASE_URL: ${ADMIN_DATABASE_URL:-}
      TENANT_RLS_ENFORCE: ${TENANT_RLS_ENFORCE:-on}
      # The worker renders reminders and report emails; keep "today" in the
      # studio's zone here too.
      APP_TIMEZONE: ${APP_TIMEZONE:-}
      JWT_SECRET: ${JWT_SECRET}
      FRONTEND_URL: ${FRONTEND_URL}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      PUSH_ENABLED: ${PUSH_ENABLED:-}
      FIREBASE_SERVICE_ACCOUNT: ${FIREBASE_SERVICE_ACCOUNT:-}
      FIREBASE_SERVICE_ACCOUNT_PATH: ${FIREBASE_SERVICE_ACCOUNT_PATH:-}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
      # The worker sends WhatsApp and charges renewals; the API does not.
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_WHATSAPP_FROM: ${TWILIO_WHATSAPP_FROM:-}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      # The worker opens its own pool; tuning it here matters as much as in
      # the API. DATABASE_SSL_CA is a container path (see the API service).
      DATABASE_POOL_SIZE: ${DATABASE_POOL_SIZE:-}
      DATABASE_SSL_CA: ${DATABASE_SSL_CA:-}
      LOG_CAPTURE: ${LOG_CAPTURE:-}
      # AI ingestion reads uploaded files back out of object storage.
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
      # AI vars forwarded here for the same reason as on the backend service
      # (Compose forwards only named lines): a background job that calls the
      # AI provider or the usage metering must see the same provider
      # configuration the API does. Blank defaults change nothing until the
      # box's .env sets them.
      AI_API_KEY: ${AI_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_PRIMARY_MODEL: ${AI_PRIMARY_MODEL:-}
      AI_SECONDARY_MODEL: ${AI_SECONDARY_MODEL:-}
      AI_FALLBACK_MODEL: ${AI_FALLBACK_MODEL:-}
      AI_OPENROUTER_TIMEOUT_MS: ${AI_OPENROUTER_TIMEOUT_MS:-}
      AI_ALLOW_DATA_COLLECTION: ${AI_ALLOW_DATA_COLLECTION:-}
      AI_USAGE_FIELDS_MODE: ${AI_USAGE_FIELDS_MODE:-}
      AI_USD_TO_INR: ${AI_USD_TO_INR:-}
      # ── WhatsApp gateway ──────────────────────────────────────────────────
      # The worker is the process that actually sends, so it needs the same
      # gateway configuration the api has. Blank = optional, as on the api.
      WA_GATEWAY_URL: ${WA_GATEWAY_URL:-}
      WA_GATEWAY_KEY: ${WA_GATEWAY_KEY:-}
      WA_WEBHOOK_SECRET: ${WA_WEBHOOK_SECRET:-}
      WA_GATEWAY_TIMEOUT_MS: ${WA_GATEWAY_TIMEOUT_MS:-10000}
    depends_on:
      redis:
        condition: service_healthy
    # 30s rather than the default 10. The workers drain in-flight jobs on
    # SIGTERM, and being SIGKILLed mid-drain is exactly what the drain exists
    # to prevent — for the renewal queue that is a card charged with no
    # membership row written.
    stop_grace_period: 30s

# ── Container restart for the Command Center's recovery ladder ──────────────
#
# Rungs 4 and 5 (restart worker, restart API) are OFF until this is wired up.
# The console shows them disabled with the reason attached rather than hiding
# them, so nothing here is required to run the platform.
#
# Why a proxy and not the socket. Anything holding /var/run/docker.sock is root
# on the host: the Docker API includes `containers/create` (any image, any
# command, any bind mount) and `containers/{id}/exec`. Mounting the socket into
# the API container to gain a restart button would trade a restart button for a
# remote root shell.
#
# The proxy must allow the two restart calls and NOTHING else. An earlier
# version of this template used tecnativa/docker-socket-proxy with POST=1 and
# CONTAINERS=1. That grants every POST under /containers, including
# `containers/create` with a privileged container and `/` bind-mounted, i.e.
# host root for anyone who compromises the API process. The `:ro` on the socket
# mount does not restrict API calls at all (Command Center audit 2026-09-28,
# CC-3). tecnativa can only switch whole API sections on or off, so it cannot
# express "restart these two containers".
#
# wollomatic/socket-proxy allow-lists by method AND path regex. Below, the only
# thing it forwards is POST /containers/<backend or worker>/restart. The ERP client
# (modules/command-center/container-recovery.js) builds only that call, so the
# limit is held in two independent places.
#
# ── Enabling it ─────────────────────────────────────────────────────────────
#
# Opt-in through the `recovery` compose profile, so nothing here starts until a
# deployment asks for it. In the .env beside this file:
#
#   COMPOSE_PROFILES=recovery
#   DOCKER_PROXY_URL=http://docker-socket-proxy:2375
#   CC_API_CONTAINER=<backend container name>   letters, digits, _ and - only
#   CC_WORKER_CONTAINER=<worker container name>  (no dots: they are regex here)
#   DOCKER_GID=<gid of /var/run/docker.sock>     stat -c %g /var/run/docker.sock
#
# The flags below were checked against the pinned image itself
# (`docker run --rm wollomatic/socket-proxy:1.13.1 -help`) and exercised
# against real containers: the two restarts answer 204; restarting any other
# container, stop/start/kill/exec/create, images/volumes/networks/build/system,
# every GET and HEAD, and any client other than the backend are refused (403/405).
# The proxy anchors each pattern with ^...$ itself.

  docker-socket-proxy:
    profiles: ['recovery']
    # Pinned by version AND digest. The digest is what was tested.
    image: wollomatic/socket-proxy:1.13.1@sha256:3935b709275e4ec35d6ed5a5c4a1f0d01ed31eec5e7234efc3357ecd47689002
    restart: unless-stopped
    command:
      - '-loglevel=INFO'
      # Listen inside the container network. Not published (see `expose`).
      - '-listenip=0.0.0.0'
      # Only the backend service may connect. Resolved per request, so it follows
      # the backend container across restarts and refuses whoever inherits its IP.
      - '-allowfrom=backend'
      # The whole allow-list. No other method is set, so every GET, HEAD, PUT,
      # DELETE and any other POST is refused.
      - '-allowPOST=(/v[0-9.]+)?/containers/(${CC_API_CONTAINER:-erp-api}|${CC_WORKER_CONTAINER:-erp-worker})/restart'
      - '-allowhealthcheck'
      - '-watchdoginterval=3600'
      - '-stoponwatchdog'
      - '-shutdowngracetime=5'
    healthcheck:
      test: ['CMD', './healthcheck']
      interval: 30s
      timeout: 5s
      retries: 3
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    # The image runs as nobody (65534); the socket is root:docker 0660, so the
    # proxy joins the socket's group. Unset falls back to nogroup, which cannot
    # read the socket: a missing DOCKER_GID fails closed (unhealthy proxy,
    # restarts refused) rather than being guessed.
    group_add:
      - '${DOCKER_GID:-65534}'
    read_only: true
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    # Never published to the host. Only the backend container reaches it, over the
    # compose network, by service name.
    expose:
      - '2375'

volumes:
  redis-data:
